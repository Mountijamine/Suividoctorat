<h2>Login</h2>
<div>
  <label>Username<br>
    <input [(ngModel)]="username" />
  </label>
</div>
<div>
  <label>Password<br>
    <input type="password" [(ngModel)]="password" />
  </label>
</div>
<div style="margin-top:1rem;">
  <button class="button" (click)="login()">Login (demo)</button>
</div>
