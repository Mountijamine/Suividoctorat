<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Users</title>
</head>
<body>
<h2>Users</h2>
<div th:if="${message}" style="color:green"> <p th:text="${message}"></p> </div>
<p><a th:href="@{/}">Home</a> | <a th:href="@{/logout}">Logout</a></p>
<table border="1">
    <tr><th>ID</th><th>Email</th><th>First</th><th>Last</th><th>Requested</th><th>Approved</th><th>Roles</th><th>Assign</th></tr>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.firstName}"></td>
        <td th:text="${u.lastName}"></td>
        <td th:text="${u.requestedProfile}"></td>
        <td th:text="${u.approved}"></td>
        <td th:text="${u.roles}"></td>
        <td>
            <form method="post" th:action="@{/admin/assign-role}" style="display:inline-block">
                <input type="hidden" name="email" th:value="${u.email}" />
                <select name="role">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
                <button type="submit">Assign</button>
            </form>
            <form method="post" th:action="@{/admin/approve-user}" style="display:inline-block" th:if="${u.approved} == false and ${u.requestedProfile} != null">
                <input type="hidden" name="email" th:value="${u.email}" />
                <button type="submit">Approve Request</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
