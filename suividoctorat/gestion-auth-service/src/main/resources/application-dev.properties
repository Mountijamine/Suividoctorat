# Development-only properties. DO NOT USE IN PRODUCTION.
# This file provides a dev JWT secret so the application can start when run with the 'dev' profile.
# The DevResetAdminPassword component is active under 'dev' and will set the seeded admin's password to 'admin123'.

# Dev JWT secret (plain text, only for local development). Replace before deploying.
app.jwt.secret=dev-secret-please-change-very-secure-123456

# Expose actuator endpoints locally for metrics/health
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Internal notification secret used between services in dev
app.notification.internal-secret=dev-internal-secret
# dev overrides
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:gestionauth;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
