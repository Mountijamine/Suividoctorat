server.port=8091
spring.main.allow-bean-definition-overriding=true

# JPA / H2 (in-memory for dev)
spring.datasource.url=jdbc:mysql://localhost:3306/suividoctorat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# JWT secret (demo) - replace with secure config in production
app.jwt.secret=${APP_JWT_SECRET:0f8e7a9c3b2d4f6a8c9e1b2d3f4a6c7e0f8e7a9c3b2d4f6a8c9e1b2d3f4a6c7e}
app.jwt.expiration-ms=3600000
app.jwt.expiration-ms=86400000

# Email (placeholder for starting email auth later)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=

# Notification service (optional) - set to your notification-service endpoint
app.notification.url=http://localhost:8094/api/notifications

# Eureka client registration
spring.application.name=gestion-auth-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# For local development we may not run a Eureka server. Disable the client to avoid
# com.netflix.discovery.shared.transport.TransportException when no Eureka is available.
eureka.client.enabled=true

# Disable Spring Cloud compatibility check (dev only)
spring.cloud.compatibility-verifier.enabled=false

# Development helper: when true, allows a small set of read-only API endpoints (e.g. GET /api/admin/users)
# to be accessed without authentication. Set to false in production.
app.dev.api-open=true
