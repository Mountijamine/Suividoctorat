server.port=8888
spring.application.name=config-server

# Eureka 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

autoconfigure.exclude=org.springframework.cloud.config.client.ConfigServiceBootstrapConfiguration


spring.cloud.config.server.git.uri=https://github.com/Mountijamine/Config-Server.git
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=Hamza
spring.cloud.config.server.git.search-paths=.



