<div class="wrap">
  <div class="tools">
    <div style="display:flex; gap:0.5rem; align-items:center">
  <input placeholder="Rechercher..." [(ngModel)]="query" (change)="setPage(0)" style="padding:0.5rem; border-radius:8px; border:1px solid #eef2f7" />
  <select [(ngModel)]="filterType" (change)="setPage(0)" style="padding:0.45rem; border-radius:8px; border:1px solid #eef2f7">
        <option value="all">Tous</option>
        <option *ngFor="let c of categories()" [value]="c">{{ c | titlecase }}</option>
      </select>
      <a routerLink="/documents/add" style="margin-left:0.5rem; padding:0.45rem 0.7rem; border-radius:8px; background:#eef2ff; color:#1e40af; text-decoration:none">Ajouter</a>
    </div>
    <div style="display:flex; gap:0.5rem; align-items:center">
      <button (click)="exportCSV()" style="background:linear-gradient(90deg,#7c3aed,#06b6d4); color:#fff; border:0; padding:0.5rem 0.8rem; border-radius:8px">Exporter CSV</button>
      <button (click)="load()" style="background:transparent; border:1px solid #e6eef8; padding:0.45rem 0.7rem; border-radius:8px">Rafraîchir</button>
    </div>
  </div>

  <div class="grid">
    <div *ngFor="let d of docs()" class="doc-card">
      <div class="meta">
        <div>
          <div style="font-weight:700">{{ d.title }}</div>
          <div style="color:#6b7280">{{ d.date }}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end">
          <div class="badge">{{ d.category || d.type || '—' }}</div>
          <input type="checkbox" [checked]="selected()[d.id]" (change)="toggle(d.id)" aria-label="Select document" />
        </div>
      </div>
      <div style="color:#374151">{{ d.description || d.excerpt || '' }}</div>
      <div style="display:flex; gap:0.5rem; align-items:center; color:#6b7280; font-size:0.9rem">
        <div>{{ d.uploadedAt ? (d.uploadedAt | date:'medium') : (d.date || '') }}</div>
      </div>
      <div class="actions">
        <button class="btn outline" (click)="downloadDocument(d.id)">Télécharger</button>
        <button class="btn" (click)="shareDocument(d.id)">Partager</button>
      </div>
    </div>
  </div>

    <div style="display:flex; justify-content:center; gap:0.5rem; margin-top:1rem; align-items:center">
      <button (click)="setPage(page()-1)" [disabled]="page()===0">Préc.</button>
      <div>Page {{ page()+1 }} / {{ totalPages() }}</div>
      <button (click)="setPage(page()+1)" [disabled]="page() >= totalPages()-1">Suiv.</button>
    </div>
</div>
