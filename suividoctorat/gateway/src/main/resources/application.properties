server.port=8080
spring.main.allow-bean-definition-overriding=true

# Force reactive web application type for Spring Cloud Gateway
spring.main.web-application-type=reactive

# Eureka server configuration
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# expose actuator endpoints (optional)
management.endpoints.web.exposure.include=health,info,metrics
# Disable strict Spring Cloud release train compatibility check (only for local/dev)
spring.cloud.compatibility-verifier.enabled=false

# Spring Cloud Gateway (simple routes using Eureka service IDs)
spring.cloud.gateway.discovery.locator.enabled=true

# Example: route /api/auth/** to gestion-auth-service (uses serviceId registered in Eureka)
## DEV-FRIENDLY: direct route to local auth service (no Eureka required)
spring.cloud.gateway.routes[0].id=auth-service-direct
spring.cloud.gateway.routes[0].uri=http://localhost:8091
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Example (fallback) using Eureka-based resolution - kept for later
# spring.cloud.gateway.routes[1].id=auth-service
# spring.cloud.gateway.routes[1].uri=lb://gestion-auth-service
# spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**

# Example: route /api/candidat/** to inscription-service (if available)
## DEV-FRIENDLY direct route to local auth service for candidate APIs
spring.cloud.gateway.routes[1].id=inscription-service-direct
spring.cloud.gateway.routes[1].uri=http://localhost:8091
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/candidat/**

# Keep lb fallback for real inscription-service when available (separate route id)
spring.cloud.gateway.routes[2].id=inscription-service-fallback
spring.cloud.gateway.routes[2].uri=lb://inscription-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/candidat/**

# DEV-FRIENDLY direct route for campaigns proxies (use auth service in dev)
spring.cloud.gateway.routes[3].id=campaigns-direct
spring.cloud.gateway.routes[3].uri=http://localhost:8091
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/campaigns/**

# Fallback: forward any /api/** to gestion-auth-service if no specific route exists (useful for dev)
spring.cloud.gateway.routes[4].id=api-fallback
# Use direct local auth service in dev for any /api/** that isn't covered by other routes.
spring.cloud.gateway.routes[4].uri=http://localhost:8091
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/**

# Development-friendly global CORS configuration for Spring Cloud Gateway
# Allow local frontend dev servers on any port to call through the gateway during development.
# allow common dev origins plus the specific SPA dev port reported by the frontend
spring.cloud.gateway.globalcors.corsConfigurations[/**].allowedOriginPatterns=http://localhost:*,http://127.0.0.1:*,http://localhost:64442
spring.cloud.gateway.globalcors.corsConfigurations[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations[/**].allowCredentials=true
