<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Campaigns</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: nav}"></div>
<h1>Campaigns</h1>
<div th:if="${message}" style="color:gray"><p th:text="${message}"></p></div>
<div th:if="${error}" style="color:red"><p th:text="${error}"></p></div>
<table border="1" th:if="${campaigns}">
    <tr><th>ID</th><th>Title</th><th>Description</th></tr>
    <tr th:each="c : ${campaigns}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.title}"></td>
        <td th:text="${c.description}"></td>
    </tr>
</table>
<p th:if="${inscriptionUrl}">Connected to: <span th:text="${inscriptionUrl}"></span></p>
</body>
</html>
