<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Mes documents</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: nav}"></div>
<h1>Mes documents</h1>
<div th:if="${message}" style="color:green"><p th:text="${message}"></p></div>
<div th:if="${error}" style="color:red"><p th:text="${error}"></p></div>
<form method="get" th:action="@{/candidat/documents}">
    <label>Recherche: <input type="text" name="q" th:value="${q}"/> </label>
    <label>Catégorie (libre): <input type="text" name="category" th:value="${category}" placeholder="e.g. diplome"/></label>
    <button type="submit">Filtrer</button>
</form>
<div>
    <form method="get" th:action="@{/candidat/documents}">
        <label>Page size: <input type="number" name="size" th:value="${size}" min="1"/></label>
        <input type="hidden" name="q" th:value="${q}" />
        <input type="hidden" name="category" th:value="${category}" />
        <button type="submit">Update page size</button>
    </form>
</div>

<p><a th:href="@{/candidat/documents/add}"><button>Add document</button></a></p>


<table border="1">
    <tr><th>ID</th><th>Original</th><th>Type</th><th>UploadedAt</th><th>Actions</th></tr>
    <tr th:each="d : ${docs}">
        <td th:text="${d.id}"></td>
        <td th:text="${d.title} == null ? d.originalFilename : d.title"></td>
        <td th:text="${d.category}"></td>
        <td th:text="${d.contentType}"></td>
        <td th:text="${d.uploadedAt}"></td>
        <td>
            <a th:href="@{/documents/download/{id}(id=${d.id})}">Télécharger</a>
            <form method="post" th:action="@{/candidat/documents/delete}" style="display:inline-block">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="id" th:value="${d.id}" />
                <button type="submit">Supprimer</button>
            </form>
        </td>
    </tr>
</table>

<div>
    <span th:text="'Page ' + ${page} + ' / ' + ${totalPages}"></span>
    <div>
        <a th:if="${page} > 0" th:href="@{/candidat/documents(page=${page - 1}, size=${size}, q=${q}, category=${category})}">Prev</a>
        <a th:if="${page} + 1 < ${totalPages}" th:href="@{/candidat/documents(page=${page + 1}, size=${size}, q=${q}, category=${category})}">Next</a>
    </div>
    <div>Total: <span th:text="${totalElements}"></span></div>
</div>

<p><a th:href="@{/dashboard}">Retour Dashboard</a></p>
</body>
</html>
