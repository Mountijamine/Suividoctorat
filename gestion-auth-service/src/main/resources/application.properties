spring.application.name=gestion-auth-service
# Import config from Config Server - FAIL FAST if server is unavailable
# Try to import config from Config Server if available (optional for local dev)
spring.config.import=optional:configserver:http://localhost:8888
# Do not fail fast when Config Server is unavailable during development
spring.cloud.config.fail-fast=false
# Retry configuration for Config Server connection
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.multiplier=1.1

# Local fallback values (only used if Config Server truly unavailable after retries)
# These ensure the service doesn't start with insecure defaults
app.jwt.secret=0f8e7a9c3b2d4f6a8c9e1b2d3f4a6c7e0f8e7a9c3b2d4f6a8c9e1b2d3f4a6c7e
app.jwt.expiration-ms=86400000

# Notification service URL (base URL pointing to notification-service's /api/notifications)
# When running locally the notification-service in this repo listens on port 8094
# Example: app.notification.url=http://localhost:8094/api/notifications
app.notification.url=http://localhost:8094/api/notifications
