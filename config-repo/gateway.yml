spring:
  application:
    name: gateway

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.devbuild: DEBUG

spring:
  cloud:
    gateway:
      routes:
        - id: gestion-auth
          uri: lb://gestion-auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: gestion-notification
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
          filters:
            - StripPrefix=1

# Add environment-specific overrides as gateway-dev.yml / gateway-prod.yml as needed
