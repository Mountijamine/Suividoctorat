spring.main.allow-bean-definition-overriding=true

spring.main.web-application-type=reactive


spring.application.name=gateway

# Import configuration from Config Server (optional: will fall back to local if server unavailable)
spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.compatibility-verifier.enabled=false


spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.globalcors.corsConfigurations[/**].allowedOriginPatterns=http://localhost:*,http://127.0.0.1:*,http://localhost:64442
spring.cloud.gateway.globalcors.corsConfigurations[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations[/**].allowCredentials=true
